[project]
name = "loci"
version = "0.1.0"
description = "Engine for an agent harness that runs geospatial workflows scientists can trust"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, simplify, ruff-specific
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
files = ["src", "tests"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Network tests are deselected by default; run them with `uv run pytest -m network`.
addopts = ["-ra", "--strict-markers", "--import-mode=importlib", "-m", "not network"]
markers = ["network: needs internet access (deselected by default)"]
xfail_strict = true
